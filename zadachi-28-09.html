<title>Задачи недели 28.09</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@600&display=swap">
<style>
:root{
  --bg:#F6F7F3; --panel:#FFFFFF; --ink:#1C2330; --mut:#5E6776; --line:#DCE0D8;
  --common:#0F766E; --common-soft:#DDF1EE;
  --eleven:#8A3B6B; --eleven-soft:#F5E3EC;
  --ai:#2F5DA8; --ai-soft:#E2EAF7;
  --a:#2F7D32; --b:#9A5B00; --c:#B3261E;
  --a-soft:#E3F1E3; --b-soft:#FBEBD2; --c-soft:#F9E0DE;
  --ans:#0F5132; --ans-soft:#E1F2E8;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#12161C; --panel:#1A2029; --ink:#E7EBF0; --mut:#9AA4B2; --line:#2B3440;
  --common:#5CCFC2; --common-soft:#173532;
  --eleven:#E59BC4; --eleven-soft:#3A1F2F;
  --ai:#8DB4F0; --ai-soft:#1B2A42;
  --a:#7BCB7F; --b:#E8B45A; --c:#F08C84;
  --a-soft:#1B3020; --b-soft:#3A2C14; --c-soft:#3D1D1B;
  --ans:#8FDCB0; --ans-soft:#17301F;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12161C; --panel:#1A2029; --ink:#E7EBF0; --mut:#9AA4B2; --line:#2B3440;
  --common:#5CCFC2; --common-soft:#173532;
  --eleven:#E59BC4; --eleven-soft:#3A1F2F;
  --ai:#8DB4F0; --ai-soft:#1B2A42;
  --a:#7BCB7F; --b:#E8B45A; --c:#F08C84;
  --a-soft:#1B3020; --b-soft:#3A2C14; --c-soft:#3D1D1B;
  --ans:#8FDCB0; --ans-soft:#17301F;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  margin:0;padding-inline:18px;padding-block:24px 64px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(22px,3.6vw,32px);line-height:1.15;margin:0;text-wrap:balance}
.lede{color:var(--mut);margin:8px 0 0;max-width:66ch}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{font:600 14px var(--body);color:var(--mut);background:transparent;border:0;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{font:600 14px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:8px 14px;border-radius:10px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--ans-soft);color:var(--ans);border-color:var(--ans)}
button:focus-visible{outline:2px solid var(--common);outline-offset:2px}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
  font:500 13px var(--body);color:var(--mut);background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;cursor:pointer;min-width:150px}
.tab b{font:700 13px var(--mono);color:var(--ink)}
.tab[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}

.who{display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;padding:3px 9px;border-radius:6px}
.who.all{background:var(--common-soft);color:var(--common)}
.who.el{background:var(--eleven-soft);color:var(--eleven)}
.who.ai{background:var(--ai-soft);color:var(--ai)}
.set-head{display:flex;flex-direction:column;gap:8px}
.set-head h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.when{font-size:13.5px;color:var(--mut)}

.theory{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.theory h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.theory ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tt-wrap{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.tt{border-collapse:collapse;font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.tt th,.tt td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.tt th{background:var(--bg);font-weight:700}

.group{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.group header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
.group header h3{margin:0;font-size:16px;font-weight:600}
.group header .note{font-size:13px;color:var(--mut)}
.lv{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font:700 13px/1 var(--mono)}
.lv.A{background:var(--a-soft);color:var(--a)}
.lv.B{background:var(--b-soft);color:var(--b)}
.lv.C{background:var(--c-soft);color:var(--c)}
.lvs{display:inline-flex;gap:4px}
ol.tasks{list-style:none;margin:0;padding:0;counter-reset:t}
ol.tasks>li{counter-increment:t;display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;
  padding:12px 18px;border-bottom:1px solid var(--line);font-size:17px}
ol.tasks>li:last-child{border-bottom:0}
ol.tasks>li::before{content:counter(t) ".";font:700 15px var(--mono);color:var(--mut);padding-top:2px}
.q{min-width:0}
.q .opt{display:block;padding-left:4px}
.a{grid-column:2;display:none;font:500 14.5px/1.5 var(--body);color:var(--ans);background:var(--ans-soft);
  border-radius:8px;padding:6px 10px;justify-self:start}
.a code{font-family:var(--mono)}
body.show-ans .a{display:block}
code,.m{font-family:var(--mono);font-size:.95em}
sub{font-size:.7em}

.prompt{position:relative;background:var(--ai-soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.prompt p{margin:0 0 10px;font:500 15px/1.6 var(--mono);white-space:pre-wrap}
.prompt .btn{font-size:13px;padding:6px 12px}
.scenes{overflow-x:auto}
.scenes table{border-collapse:collapse;width:100%;min-width:560px;font-size:14.5px}
.scenes th,.scenes td{border:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}
.scenes th{background:var(--bg);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.scenes td{height:56px}
.scenes td:first-child{width:44px;font:700 14px var(--mono);color:var(--mut)}
.pad{padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.hidden-print{display:none}
@media (max-width:520px){
  ol.tasks>li{grid-template-columns:26px minmax(0,1fr);padding:12px 14px;font-size:16px}
  .group header{padding:12px 14px}
}
</style>

<div class="wrap">
  <header>
    <h1 id="h1">Задачи недели · 28.09 – 02.10</h1>

<script>
const T = (ru, kz) => ({ru, kz: kz ?? ru});
const UI = {
  lede: T("Пять наборов на неделю. Ответы скрыты — включайте их для себя, когда экран не на проекторе.",
          "Аптаға арналған бес жинақ. Жауаптар жасырылған — экран проекторда болмағанда өзіңіз үшін қосыңыз."),
  h1: T("Задачи недели · 28.09 – 02.10", "Апта есептері · 28.09 – 02.10"),
  ansOff: T("Показать ответы", "Жауаптарды көрсету"),
  ansOn: T("Ответы показаны", "Жауаптар көрсетілді"),
  theory: T("Коротко к теме", "Тақырып қысқаша"),
  copy: T("Скопировать", "Көшіру"), copied: T("Скопировано", "Көшірілді"),
  all: T("10 + 11", "10 + 11"), el: T("только 11", "тек 11"), ai: T("ИИ", "ЖИ"),
  scene: T("Где", "Қайда"), what: T("Что происходит", "Не болады"), line: T("Реплика героя", "Кейіпкер сөзі"),
};

const SETS = [
/* ---------- 1 ---------- */
{ id:"set1", code:"Д1", who:"all",
  title:T("Повторение: системы счисления","Қайталау: санау жүйелері"),
  when:T("Пн — 10 А, 10 Б, 11 Б/Е · Вт — 11 А/Ә","Дс — 10 А, 10 Б, 11 Б/Е · Сс — 11 А/Ә"),
  groups:[
  { name:T("Разминка, устно","Ой қозғау, ауызша"), lv:"A", items:[
    [T("Сколько цифр в двоичной системе и какие?","Екілік жүйеде неше цифр бар және қандай?"), T("Две: 0 и 1","Екеу: 0 және 1")],
    [T("Какое основание у шестнадцатеричной системы?","Он алтылық жүйенің негізі қандай?"), T("16","16")],
    [T("Сколько бит в одном байте?","Бір байтта неше бит бар?"), T("8","8")],
  ]},
  { name:T("Практика, уровень A","Практика, A деңгейі"), lv:"A", items:[
    [T("Переведите 45<sub>10</sub> в двоичную систему.","45<sub>10</sub> санын екілік жүйеге аударыңыз."), T("<code>101101<sub>2</sub></code>")],
    [T("Переведите 110101<sub>2</sub> в десятичную систему.","110101<sub>2</sub> санын ондық жүйеге аударыңыз."), T("<code>53<sub>10</sub></code>")],
    [T("Переведите 100<sub>10</sub> в двоичную систему.","100<sub>10</sub> санын екілік жүйеге аударыңыз."), T("<code>1100100<sub>2</sub></code>")],
    [T("Переведите 1011011<sub>2</sub> в десятичную систему.","1011011<sub>2</sub> санын ондық жүйеге аударыңыз."), T("<code>91<sub>10</sub></code>")],
    [T("Переведите 1110100<sub>2</sub> в восьмеричную систему. Разбейте на триады справа налево.","1110100<sub>2</sub> санын сегіздік жүйеге аударыңыз. Оңнан солға қарай триадаларға бөліңіз."),
     T("<code>1 110 100 → 164<sub>8</sub></code>")],
  ]},
  { name:T("Практика, уровень B","Практика, B деңгейі"), lv:"B", items:[
    [T("Переведите 3F<sub>16</sub> в двоичную и в десятичную системы.","3F<sub>16</sub> санын екілік және ондық жүйеге аударыңыз."), T("<code>111111<sub>2</sub> = 63<sub>10</sub></code>")],
    [T("Сложите в двоичной системе: 10110<sub>2</sub> + 1111<sub>2</sub>.","Екілік жүйеде қосыңыз: 10110<sub>2</sub> + 1111<sub>2</sub>."), T("<code>100101<sub>2</sub></code> (22 + 15 = 37)")],
    [T("Сколько единиц в двоичной записи числа 200?","200 санының екілік жазбасында неше бірлік бар?"), T("3 (<code>11001000<sub>2</sub></code>)")],
  ]},
  { name:T("Домашнее задание · 10 класс, к Д3","Үй тапсырмасы · 10-сынып, Д3-ке"), lv:"AB", items:[
    [T("Переведите 77<sub>10</sub> в двоичную систему.","77<sub>10</sub> санын екілік жүйеге аударыңыз."), T("<code>1001101<sub>2</sub></code>")],
    [T("Переведите 101010<sub>2</sub> в десятичную систему.","101010<sub>2</sub> санын ондық жүйеге аударыңыз."), T("<code>42<sub>10</sub></code>")],
    [T("Переведите 1C<sub>16</sub> в десятичную систему.","1C<sub>16</sub> санын ондық жүйеге аударыңыз."), T("<code>28<sub>10</sub></code>")],
    [T("Переведите 57<sub>8</sub> в десятичную систему.","57<sub>8</sub> санын ондық жүйеге аударыңыз."), T("<code>47<sub>10</sub></code>")],

  ]},
  { name:T("Домашнее задание · 11 класс, к Д2","Үй тапсырмасы · 11-сынып, Д2-ге"), lv:"BC", items:[

    [T("Вычислите в двоичной системе: 110110<sub>2</sub> − 1011<sub>2</sub>.","Екілік жүйеде есептеңіз: 110110<sub>2</sub> − 1011<sub>2</sub>."), T("<code>101011<sub>2</sub></code> (54 − 11 = 43)")],

    [T("Какое число больше: 101<sub>16</sub> или 401<sub>8</sub>?","Қай сан үлкен: 101<sub>16</sub> әлде 401<sub>8</sub>?"), T("Они равны: оба 257<sub>10</sub>","Олар тең: екеуі де 257<sub>10</sub>")],
  ]},
]},
/* ---------- 2 ---------- */
{ id:"set2", code:"Д2", who:"el",
  title:T("IP-адрес и маска подсети","IP-адрес және желі маскасы"),

  theory:{ items:[
    T("<b>IP-адрес (IPv4)</b> — 4 числа от 0 до 255 через точку. Каждое число — байт (октет), 8 бит. Всего 32 бита.",
      "<b>IP-адрес (IPv4)</b> — нүкте арқылы жазылған 0-ден 255-ке дейінгі 4 сан. Әр сан — бір байт (октет), 8 бит. Барлығы 32 бит."),
    T("<b>Маска подсети</b> — тоже 32 бита: сначала только единицы, потом только нули. 255.255.255.0 — это 24 единицы, записывают /24.",

    T("<b>Адресов в сети</b> 2<sup>k</sup>, где k — число нулей в маске. Компьютерам можно выдать 2<sup>k</sup> − 2: адрес сети и широковещательный адрес заняты.",

  ]},
  groups:[

    note:T("Читаете определение — ученики пишут термин.","Анықтаманы оқисыз — оқушылар терминді жазады."), items:[
    [T("Способ записи чисел с помощью цифр.","Сандарды цифрлар арқылы жазу тәсілі."), T("Система счисления","Санау жүйесі")],
    [T("Количество цифр, которые использует позиционная система.","Позициялық жүйе қолданатын цифрлар саны."), T("Основание","Негіз")],

    [T("Группа из 3 двоичных разрядов при переводе в восьмеричную.","Сегіздік жүйеге аударғанда 3 екілік разрядтан тұратын топ."), T("Триада","Триада")],

  { name:T("Задачи, уровень B","Есептер, B деңгейі"), lv:"B", items:[

    [T("<b>Препятствия.</b> Две-три трудности на пути к цели.","<b>Кедергілер.</b> Мақсатқа жету жолындағы екі-үш қиындық.")],
    [T("<b>Кульминация.</b> Самый напряжённый момент: получится или нет?","<b>Шарықтау шегі.</b> Ең шиеленісті сәт: жете ме, жоқ па?")],
    [T("<b>Развязка.</b> Чем всё закончилось и что герой понял?","<b>Шешім.</b> Барлығы немен аяқталды және кейіпкер нені түсінді?")],
  ]},
  { name:T("Шаг 3 · ИИ как соавтор · 5 минут с телефоном","3-қадам · ЖИ — бірлескен автор · телефонмен 5 минут"),
    note:T("ИИ предлагает идеи — вы выбираете и переписываете своими словами.","ЖИ идея ұсынады — сіз таңдайсыз және өз сөзіңізбен қайта жазасыз."),
    prompt:T("Ты — сценарист мультфильмов для подростков. Мой персонаж: [имя, внешность, характер — из паспорта персонажа]. Предложи 3 идеи для серии длиной 1 минута. Для каждой идеи дай логлайн в одно предложение и главный конфликт. Без насилия.",
             "Сен — жасөспірімдерге арналған мультфильм сценарисісің. Менің кейіпкерім: [аты, сырт келбеті, мінезі — кейіпкер паспортынан]. Ұзақтығы 1 минуттық серияға 3 идея ұсын. Әр идея үшін бір сөйлемдік логлайн мен басты қақтығысты жаз. Зорлық-зомбылықсыз."),
    items:[] },
  { name:T("Шаг 4 · Сцены","4-қадам · Көріністер"),
    note:T("Четыре-пять сцен. Каждая сцена станет кадром на следующем уроке.","Төрт-бес көрініс. Әр көрініс келесі сабақта кадрға айналады."),
    scenes:5, items:[] },
  { name:T("Домашнее задание","Үй тапсырмасы"), items:[
    [T("Допишите сценарий до пяти сцен. В каждой сцене — место, действие и одна реплика героя.","Сценарийді бес көрініске дейін жазып бітіріңіз. Әр көріністе — орын, әрекет және кейіпкердің бір сөзі.")],
    [T("На следующем уроке: раскадровка. Каждую сцену превратим в кадр с помощью генерации изображений.","Келесі сабақта: раскадровка. Әр көріністі сурет генерациясы арқылы кадрға айналдырамыз.")],
  ]},
]},
];

/* ------------ render ------------ */
let lang="ru", cur="set1", showAns=false;
try{ lang=localStorage.getItem("z-lang")||"ru"; cur=localStorage.getItem("z-set")||"set1"; }catch(e){}
const h=location.hash.replace("#",""); if(SETS.some(s=>s.id===h)) cur=h;
const $=id=>document.getElementById(id);
const L=o=>o?o[lang]:"";

function lvBadges(lv){ return lv?`<span class="lvs">${[...lv].map(x=>`<i class="lv ${x}">${x}</i>`).join("")}</span>`:""; }
function whoTag(w){ return `<span class="who ${w}">${L(UI[w])}</span>`; }

function renderTabs(){
  $("tabs").innerHTML=SETS.map(s=>`<button class="tab" role="tab" type="button" data-id="${s.id}" aria-selected="${s.id===cur}">
    <b>${s.code}</b><span>${L(s.title)}</span></button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ cur=b.dataset.id; save(); render(); });
}
function table(t){
  const [cap,rows]=t;
  return `<table class="tt" aria-label="${cap}"><thead><tr>${rows[0].map(c=>`<th>${c}</th>`).join("")}</tr></thead>
    <tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function renderSet(){
  const s=SETS.find(x=>x.id===cur)||SETS[0];
  let html=`<section class="set-head"><div class="chips">${whoTag(s.who)}<span class="when">${L(s.when)}</span></div>
    <h2>${s.code} · ${L(s.title)}</h2></section>`;
  if(s.theory){
    html+=`<section class="theory"><h3>${L(UI.theory)}</h3><ul>${s.theory.items.map(i=>`<li>${L(i)}</li>`).join("")}</ul>
      ${s.theory.tables?`<div class="tt-wrap">${s.theory.tables.map(table).join("")}</div>`:""}</section>`;
  }
  s.groups.forEach((g,gi)=>{
    html+=`<section class="group"><header>${lvBadges(g.lv)}<h3>${L(g.name)}</h3>${g.note?`<span class="note">${L(g.note)}</span>`:""}</header>`;
    if(g.items.length){
      html+=`<ol class="tasks">${g.items.map(([q,a])=>`<li><div class="q">${L(q)}</div>${a?`<div class="a">${L(a)}</div>`:""}</li>`).join("")}</ol>`;
    }
    if(g.prompt){
      html+=`<div class="pad"><div class="prompt"><p id="pr${gi}">${L(g.prompt)}</p>
        <button class="btn" type="button" data-copy="pr${gi}">${L(UI.copy)}</button></div></div>`;
    }
    if(g.scenes){
      html+=`<div class="pad"><div class="scenes"><table><thead><tr><th>№</th><th>${L(UI.scene)}</th><th>${L(UI.what)}</th><th>${L(UI.line)}</th></tr></thead>
        <tbody>${Array.from({length:g.scenes},(_,i)=>`<tr><td>${i+1}</td><td></td><td></td><td></td></tr>`).join("")}</tbody></table></div></div>`;
    }
    html+=`</section>`;
  });
  $("set").innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">${html}</div>`;
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{
    const el=$(b.dataset.copy), txt=el.textContent;
    const done=()=>{ b.textContent=L(UI.copied); setTimeout(()=>b.textContent=L(UI.copy),1500); };
    const sel=()=>{ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); };
    try{ navigator.clipboard.writeText(txt).then(done,sel); }catch(e){ sel(); }
  });
}
function render(){
  document.documentElement.lang = lang==="kz"?"kk":"ru";
  $("h1").innerHTML=L(UI.h1); $("lede").textContent=L(UI.lede);
  $("lang-ru").setAttribute("aria-pressed",lang==="ru"); $("lang-kz").setAttribute("aria-pressed",lang==="kz");
  $("ans").setAttribute("aria-pressed",showAns); $("ans").textContent=L(showAns?UI.ansOn:UI.ansOff);
  document.body.classList.toggle("show-ans",showAns);
  renderTabs(); renderSet();
}
function save(){ try{ localStorage.setItem("z-lang",lang); localStorage.setItem("z-set",cur); }catch(e){} }
$("lang-ru").onclick=()=>{ lang="ru"; save(); render(); };
$("lang-kz").onclick=()=>{ lang="kz"; save(); render(); };
$("ans").onclick=()=>{ showAns=!showAns; render(); };
render();
</script>
